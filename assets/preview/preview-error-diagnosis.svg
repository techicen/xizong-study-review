<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="80" y="90" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#111827">Wrong question? Diagnose the failure mode.</text>
  <text x="80" y="132" font-family="Arial, sans-serif" font-size="24" fill="#475569">A wrong answer is not always “I didn’t know this”.</text>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="700">
    <rect x="100" y="210" width="300" height="82" rx="16" fill="#fee2e2"/>
    <text x="136" y="260" fill="#7f1d1d">knowledge gap</text>
    <rect x="450" y="210" width="300" height="82" rx="16" fill="#ffedd5"/>
    <text x="486" y="260" fill="#9a3412">mechanism break</text>
    <rect x="800" y="210" width="300" height="82" rx="16" fill="#fef3c7"/>
    <text x="838" y="260" fill="#78350f">mapping failure</text>
    <rect x="100" y="350" width="300" height="82" rx="16" fill="#dcfce7"/>
    <text x="128" y="400" fill="#14532d">examiner trap</text>
    <rect x="450" y="350" width="300" height="82" rx="16" fill="#dbeafe"/>
    <text x="482" y="400" fill="#1e3a8a">clinical decision</text>
    <rect x="800" y="350" width="300" height="82" rx="16" fill="#ede9fe"/>
    <text x="830" y="400" fill="#5b21b6">priority error</text>
  </g>
  <rect x="135" y="520" width="930" height="78" rx="14" fill="#111827"/>
  <text x="185" y="568" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">The next task depends on why the answer failed.</text>
</svg>
