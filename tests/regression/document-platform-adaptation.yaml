tests:
  - test_id: feishu_table_output
    input: |
      Use the xizong-study-review skill.
      My note app is Feishu Docs.
      Review this paragraph and output a table I can paste into Feishu Docs.

      支气管哮喘是气道慢性炎症，治疗上可以使用支气管扩张剂。
    expected_behavior:
      - Recognize Feishu Docs as a collaborative document platform.
      - Use a compact review table or comment-style bullets.
      - Preserve original paragraph.
      - Avoid Obsidian-only callout syntax unless user asks for it.
    failure_mode_to_avoid:
      - Using only Obsidian callouts.
      - Claiming direct editing of Feishu Docs without connector/browser permission.
      - Rewriting the note without preserving original text.
    pass_criteria:
      - Output includes a table or comment-style review.
      - Output mentions Feishu Docs or document-platform adaptation.
      - Output does not claim direct synchronization unless tools are available.

  - test_id: workbuddy_paste_ready_output
    input: |
      Use the xizong-study-review workflow in a WorkBuddy task.
      Review this paragraph and give me something I can paste back into my WorkBuddy task.
      Use skills/xizong-study-review/ as the core Skill behavior. No direct document connector is available in this paste-only task.

      肺气肿就是肺泡被破坏，所以 COPD 病人呼气困难。
    expected_behavior:
      - Recognize WorkBuddy as a workspace or chat context, not as proof of direct document-editing capability.
      - Recognize that skills/xizong-study-review/ is the core Skill behavior for Codex and WorkBuddy-style use.
      - Preserve the original paragraph.
      - Use portable Markdown Codex Review blocks rather than Obsidian-only callouts.
      - Optionally add a short WorkBuddy Handoff checklist with 1-2 next tasks.
    failure_mode_to_avoid:
      - Claiming it edited or synchronized a WorkBuddy document.
      - Using only Obsidian callout syntax.
      - Rewriting the note into a full COPD summary.
      - Entering Decision Engine v1 without complete stem and options.
    pass_criteria:
      - Output includes a portable Codex Review block or equivalent Markdown block.
      - Output says direct editing requires an available connector/file/browser surface if mentioned at all.
      - Output may mention WorkBuddy Skill use, but does not claim Skill Market publication or connector support.
      - Output gives no more than 1-2 next tasks.
