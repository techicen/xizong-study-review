<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <rect width="1200" height="1800" fill="#f4f5f7"/>
  <rect x="150" y="48" width="900" height="1704" rx="18" fill="#ffffff"/>
  <text x="220" y="128" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Example: Obsidian-style Inline Audit</text>
  <text x="220" y="174" font-family="Arial, sans-serif" font-size="20" fill="#64748b">Sanitized public preview. No real lecture files, true questions, answers, or personal notes.</text>

  <line x1="220" y1="210" x2="980" y2="210" stroke="#e5e7eb" stroke-width="2"/>

  <text x="220" y="278" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">0. 本节任务</text>
  <g font-family="Arial, sans-serif" font-size="19" fill="#334155">
    <rect x="224" y="314" width="18" height="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="258" y="330">用一句话说明疾病本质</text>
    <rect x="224" y="350" width="18" height="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="258" y="366">解释关键表现背后的机制链</text>
    <rect x="224" y="386" width="18" height="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="258" y="402">区分相似疾病和常见干扰项</text>
    <rect x="224" y="422" width="18" height="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="258" y="438">回扣一个生理点和一个病理点</text>
  </g>

  <line x1="220" y1="490" x2="980" y2="490" stroke="#e5e7eb" stroke-width="2"/>

  <text x="220" y="560" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">1. 疾病本质</text>
  <text x="250" y="622" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">一句话本质</text>
  <text x="250" y="672" font-family="Arial, sans-serif" font-size="20" fill="#334155">某慢性呼吸系统疾病的核心是长期气流受限。</text>

  <rect x="250" y="710" width="700" height="178" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="280" y="754" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ea580c">Codex 核对：一句话本质的因果顺序写反了</text>
  <text x="280" y="792" font-family="Arial, sans-serif" font-size="17" fill="#7c2d12">问题：这句话只写了结果，没有说明结构改变如何导致气流受限。</text>
  <text x="280" y="824" font-family="Arial, sans-serif" font-size="17" fill="#7c2d12">为什么影响做题：题干常把答案藏在机制词里，而不是直接写疾病名。</text>
  <text x="280" y="856" font-family="Arial, sans-serif" font-size="17" fill="#7c2d12">修正方向：改成“结构改变 → 力学变化 → 表现/检查异常”。</text>

  <text x="250" y="958" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">短特征</text>
  <g font-family="Arial, sans-serif" font-size="19" fill="#334155">
    <text x="270" y="1004">- 慢性咳嗽</text>
    <text x="270" y="1038">- 活动后气促</text>
    <text x="270" y="1072">- 检查提示气流受限</text>
  </g>

  <rect x="250" y="1115" width="700" height="154" rx="10" fill="#ecfdf5" stroke="#86efac"/>
  <text x="280" y="1158" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#059669">Codex 核对：方向是对的，但机制还要收紧</text>
  <text x="280" y="1196" font-family="Arial, sans-serif" font-size="17" fill="#064e3b">优点：能从表现回到疾病核心，不是单纯背症状。</text>
  <text x="280" y="1228" font-family="Arial, sans-serif" font-size="17" fill="#064e3b">下一步：补一句“为什么这些表现会出现”。</text>

  <text x="220" y="1350" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">2. Callback</text>
  <text x="250" y="1404" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">生理</text>
  <g font-family="Arial, sans-serif" font-size="19" fill="#334155">
    <text x="270" y="1450">- 气道阻力如何影响通气？</text>
    <text x="270" y="1484">- 呼气时胸内压变化为什么重要？</text>
  </g>
  <text x="250" y="1544" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">病理</text>
  <g font-family="Arial, sans-serif" font-size="19" fill="#334155">
    <text x="270" y="1590">- 慢性炎症如何改变气道结构？</text>
    <text x="270" y="1624">- 结构改变如何变成题干线索？</text>
  </g>

  <rect x="250" y="1660" width="700" height="54" rx="10" fill="#111827"/>
  <text x="280" y="1695" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Public preview: real workflow style, sanitized content.</text>
</svg>
